[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldsim"
version = "0.1.0"
description = "Приложение-симулятор эволюции мира с геополитикой и контролем версий"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["simulation", "worldbuilding", "geopolitics", "procedural-generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Web Environment",
    "Framework :: Streamlit",
]
dependencies = [
    "pydantic>=2.7",
    "streamlit>=1.35",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]
ai = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
worldsim = "worldsim.launcher:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
