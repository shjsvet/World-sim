[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldsim"
version = "0.1.0"
description = "Приложение-симулятор эволюции мира с геополитикой и контролем версий"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["simulation", "worldbuilding", "geopolitics", "procedural-generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Web Environment",
    "Framework :: Streamlit",
]
dependencies = [
    "pydantic>=2.7,<3",
    "streamlit>=1.35",
    "plotly>=5.22",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]
ai = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
worldsim = "worldsim.launcher:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: долгие тесты, по умолчанию не запускаются",
    "integration: интеграционные сценарии",
    "ai: тесты, требующие ИИ-провайдера",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*", "plotly", "plotly.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # Русские docstrings содержат кириллицу, похожую на латиницу.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["worldsim"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
